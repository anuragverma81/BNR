<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>{% block title %}BNR | Beyond Normal Reality{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">

</head>
<body>
<header class="navbar">
    <a class="brand" href="{{ url_for('home') }}">
        <img
            src="{{ url_for('static',filename='images/bnr-cat.png') }}"
            alt="BNR cat logo"
            class="brand-logo">
        <span>BNR<span class="blue">.</span></span>
    </a>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('tokenomics') }}">Tokenomics</a>
        <a href="{{ url_for('roadmap') }}">Roadmap</a>

    </nav>

    <span class="network-pill">. DEVNET</span>
</header>

<main>
    {% block content %}{% endblock %}
</main>
<footer>
    <div class="footer-brand">BNR-Beyond Normal Reality </div>
    <p>Independent community project</p>
    <p>BNR is not affiliated with or endorsed by DogeCoin or Solana </p>
    <p class="muted">Prototype only </p>
</footer>

<script src="{{ url_for('static',filename='js/main.js') }}"></script>
</body>
</html>
